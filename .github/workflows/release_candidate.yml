name: Compile Release Candidate

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      board:
        description: "Build only this env (e.g. picco-gh_release_rc); empty builds every board"
        required: false
        default: ""

# A newer push or manual run on the same branch cancels the older build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-candidate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pushes to release build X3/X4 and Picco. A manual run builds the chosen
        # board, or every board when none is given.
        pio_env: ${{ fromJSON(github.event_name == 'push' && '["gh_release_rc","picco-gh_release_rc"]' || inputs.board != '' && format('["{0}"]', inputs.board) || '["gh_release_rc","sticky-gh_release_rc","x4pro-gh_release_rc","x4c-gh_release_rc","papermono-gh_release_rc","metalio_eink4-gh_release_rc","eego_a4-gh_release_rc","picco-gh_release_rc"]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          # platform-espressif32's builder/main.py imports these unconditionally; its own
          # penv bootstrap (builder/penv_setup.py) is supposed to install them automatically
          # but isn't picking them up reliably in this runner image, so pin them explicitly.
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-v2-${{ runner.os }}-${{ matrix.pio_env }}-${{ hashFiles('platformio.ini', 'scripts/patch_pioarduino_cache.py') }}
          restore-keys: |
            pio-v2-${{ runner.os }}-${{ matrix.pio_env }}-
            pio-v2-${{ runner.os }}-

      - name: Pin pioarduino core inside the platform penv
        run: |
          set -euo pipefail
          # Envs with custom_sdkconfig run a nested `pio run` from
          # ~/.platformio/penv. Keep that core on the same version as the outer core.
          # See https://github.com/pioarduino/platform-espressif32/issues/529
          pio pkg install -e ${{ matrix.pio_env }}
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
          ~/.platformio/penv/bin/pio --version

      # Keep the PlatformIO build cache (build_cache_dir) between runs, so a
      # push only compiles the files that changed.
      - name: Cache compiled objects
        uses: actions/cache@v4
        with:
          path: .cache
          key: build-v2-${{ runner.os }}-${{ matrix.pio_env }}-${{ github.sha }}
          restore-keys: build-v2-${{ runner.os }}-${{ matrix.pio_env }}-

      - name: Extract env
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
          # Artifact names cannot contain "/".
          branch="${GITHUB_REF_NAME#release/}"
          echo "BRANCH_SUFFIX=${branch//\//-}" >> $GITHUB_ENV
          env_name="${{ matrix.pio_env }}"
          if [ "$env_name" = "gh_release_rc" ]; then
            echo "ASSET=firmware.bin" >> $GITHUB_ENV
          else
            echo "ASSET=firmware-${env_name%-gh_release_rc}.bin" >> $GITHUB_ENV
          fi

      - name: Build CrossPoint Release Candidate
        env:
          CROSSPOINT_RC_HASH: ${{ env.SHORT_SHA }}
        run: |
          touch "$RUNNER_TEMP/build-start"
          pio run -e ${{ matrix.pio_env }}

      # SCons touches a cache entry when it uses or adds it. Drop the entries
      # this build did not use, so the saved cache does not grow every run.
      - name: Trim build cache
        run: find .cache -mindepth 2 -type f ! -newer "$RUNNER_TEMP/build-start" -delete

      - name: Name release asset
        run: |
          if [ "${{ env.ASSET }}" != "firmware.bin" ]; then
            cp ".pio/build/${{ matrix.pio_env }}/firmware.bin" \
              ".pio/build/${{ matrix.pio_env }}/${{ env.ASSET }}"
          fi

      - name: Prepare license asset
        run: python3 scripts/build_release_license.py --env ${{ matrix.pio_env }} --output .pio/build/${{ matrix.pio_env }}/LICENSE

      - name: Upload Artifacts
        if: matrix.pio_env != 'picco-gh_release_rc'
        uses: actions/upload-artifact@v6
        with:
          name: CrossPoint-RC-${{ env.BRANCH_SUFFIX }}-${{ matrix.pio_env }}
          path: |
            .pio/build/${{ matrix.pio_env }}/bootloader.bin
            .pio/build/${{ matrix.pio_env }}/${{ env.ASSET }}
            .pio/build/${{ matrix.pio_env }}/firmware.elf
            .pio/build/${{ matrix.pio_env }}/firmware.map
            .pio/build/${{ matrix.pio_env }}/partitions.bin
            .pio/build/${{ matrix.pio_env }}/LICENSE

      # Picco keeps its vendor bootloader and partition table, so ship only the
      # app image that is flashed at 0xE0000.
      - name: Upload Picco app firmware
        if: matrix.pio_env == 'picco-gh_release_rc'
        uses: actions/upload-artifact@v6
        with:
          name: CrossPoint-RC-${{ env.BRANCH_SUFFIX }}-${{ matrix.pio_env }}
          path: |
            .pio/build/${{ matrix.pio_env }}/${{ env.ASSET }}
            .pio/build/${{ matrix.pio_env }}/LICENSE
