name: Clean up old builds

on:
  push:
    branches: [claude/project-thread-9g8ub7]

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all Compile Release Candidate runs except the kept one
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP: "42983827067"
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/actions/workflows/release_candidate.yml/runs?per_page=100" \
            --jq '.workflow_runs[] | "\(.id) \(.head_branch) \(.head_sha[0:7])"' > runs.txt
          echo "Found $(wc -l < runs.txt) runs"
          grep -q "^$KEEP " runs.txt || { echo "Kept run not found, stopping"; exit 1; }
          deleted=0
          while read -r id branch sha; do
            [ "$id" = "$KEEP" ] && { echo "KEEP $id $branch $sha"; continue; }
            gh api -X DELETE "repos/$REPO/actions/runs/$id" && echo "deleted $id $branch $sha"
            deleted=$((deleted+1))
          done < runs.txt
          echo "Deleted $deleted runs"
